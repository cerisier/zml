name: Windows CPU inference

on:
  workflow_dispatch:
  push:
    branches: [cerisier/windows-cpu-inference]
    paths:
      - .github/workflows/windows-cpu-inference.yaml
      - tools/windows-cpu-inference.*

permissions:
  contents: read

jobs:
  inference:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run native Windows CPU inference
        shell: pwsh
        run: ./tools/windows-cpu-inference.ps1 -WorkDirectory (Join-Path $env:RUNNER_TEMP 'zml-windows-inference')
      - name: Preserve inference evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-cpu-inference
          path: ${{ runner.temp }}/zml-windows-inference/evidence/
          if-no-files-found: warn
          retention-days: 7
